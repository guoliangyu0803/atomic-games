<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>电子自旋运动磁矩 · 闯关</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0b1020;--card:#151d36;--card2:#1b2542;--line:#2a3556;
    --txt:#e9eefc;--muted:#93a2c7;--teal:#2dd4bf;--gold:#f6c453;
    --red:#fb7185;--green:#34d399;--blue:#60a5fa;--violet:#a78bfa;
  }
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1100px 560px at 50% -12%,#1e2c52,#0b1020 62%);
    color:var(--txt);font-family:'Segoe UI','Microsoft YaHei',system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .back{color:var(--muted);text-decoration:none;font-size:13.5px;border:1px solid var(--line);padding:6px 11px;border-radius:10px}
  .back:hover{color:var(--txt);border-color:#3c5185}
  h1{font-size:19px;margin:0;flex:1;min-width:140px}
  .hud{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
  .chip b{color:var(--txt);font-variant-numeric:tabular-nums}

  .steps{display:flex;gap:8px;margin-bottom:14px}
  .step{height:6px;flex:1;border-radius:99px;background:#1d2643;transition:background .3s}
  .step.done{background:linear-gradient(90deg,#2dd4bf,#60a5fa)}
  .step.cur{background:linear-gradient(90deg,#f6c453,#f59e0b)}

  .panel{background:linear-gradient(180deg,var(--card),#121a30);border:1px solid var(--line);border-radius:16px;padding:20px}
  .qh{font-size:12px;letter-spacing:.16em;color:var(--teal);text-transform:uppercase;margin-bottom:8px}
  .qt{font-size:15px;line-height:1.85;color:var(--txt);margin:0}
  .qt code,.mono{font-family:Consolas,'Courier New',monospace;background:#0d1428;border:1px solid var(--line);
    border-radius:6px;padding:1px 6px;font-size:13.5px;color:#a5f3ea}
  .formula{
    background:#0d1428;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    margin:14px 0;font-family:Consolas,monospace;font-size:14px;color:#a5f3ea;line-height:2.1;overflow-x:auto;
  }
  .formula .dim{color:#7c8cb8;font-size:12.5px}

  .choices{display:grid;gap:10px;margin-top:16px;min-width:0}
  .choice{
    text-align:left;appearance:none;border:1px solid var(--line);background:#101830;color:#cfd9f0;
    border-radius:12px;padding:14px 16px;font-size:14.5px;cursor:pointer;font-family:inherit;
    transition:.15s;line-height:1.6;min-width:0;overflow-wrap:anywhere;
  }
  .choice .fv,.choice .fm{display:block}
  .choice .fm{color:#93a2c7;font-size:13px;margin-top:5px}
  .choice:hover:not(:disabled){border-color:#3c5185;background:#152040;color:#fff}
  .choice.ok{border-color:#2f9e83;background:#0f3b30;color:#a7f3d0}
  .choice.no{border-color:#7f2d3d;background:#3a1420;color:#fecdd3}
  .choice:disabled{cursor:default}

  .rows{margin:16px 0 6px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#101830;
    border:1px solid var(--line);border-radius:12px;padding:11px 14px}
  .row .lab{flex:1;min-width:180px;font-size:14px;color:#cfd9f0;font-family:Consolas,monospace}
  .row input{
    background:#0b1224;border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:9px 11px;font-size:15px;width:150px;font-family:Consolas,monospace;
  }
  .row input.wide{width:230px}
  .row input:focus{outline:none;border-color:var(--teal)}
  .row .unit{color:var(--muted);font-size:13px;white-space:nowrap}
  .row.right{border-color:#1f6f5c;background:#0c2a25}
  .row.right input{border-color:#2f9e83;color:#a7f3d0}
  .row.wrong{border-color:#7f2d3d;background:#2a1018}
  .row .mark{width:18px;text-align:center}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
  canvas{display:block;width:100%;border-radius:12px;background:#0a1122;border:1px solid var(--line)}
  .cap{color:#6b7ba4;font-size:12.5px;margin:8px 2px 0}

  .fb{margin-top:14px;border-radius:12px;padding:12px 15px;font-size:13.5px;line-height:1.75;
    border:1px solid var(--line);background:#0f1730;color:var(--muted);min-height:22px}
  .fb.ok{border-color:#1f6f5c;background:#0c2a25;color:#a7f3d0}
  .fb.bad{border-color:#7f2d3d;background:#2a1018;color:#fecdd3}

  .btn{
    appearance:none;border:1px solid transparent;border-radius:12px;padding:11px 20px;
    font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#2dd4bf,#14b8a6);color:#04211d;transition:.15s;
  }
  .btn:hover:not(:disabled){filter:brightness(1.08)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--txt)}
  .btn.ghost:hover{border-color:#3c5185}

  .modal{position:fixed;inset:0;background:rgba(6,10,20,.74);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .modal.show{display:flex}
  .modal .box{background:var(--card2);border:1px solid var(--line);border-radius:18px;
    max-width:610px;width:100%;padding:24px;max-height:86vh;overflow:auto}
  .modal h2{margin:0 0 12px;font-size:19px}
  .modal .body{color:#cfd9f0;font-size:14px;line-height:1.9}
  .modal .body ul{margin:8px 0 0;padding-left:20px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .big{font-size:26px;font-weight:800;color:var(--teal);margin:6px 0 2px}
  .kv{display:flex;flex-direction:column;gap:7px;margin-top:12px}
  .kvr{background:#101830;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    font-size:13px;font-family:Consolas,monospace;color:#cfd9f0;display:flex;justify-content:space-between;gap:10px}
  .kvr b{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← 合集</a>
    <h1>🎯 电子自旋运动磁矩</h1>
    <div class="hud">
      <span class="chip">第 <b id="hudLv">1</b> / 5 关</span>
      <span class="chip">用时 <b id="hudTime">00:00</b></span>
      <span class="chip">得分 <b id="hudScore">0</b></span>
    </div>
  </div>

  <div class="steps" id="steps">
    <div class="step cur"></div><div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div>
  </div>

  <div id="stage"></div>
  <div class="fb" id="fb">自旋没有"绕圈"的轨道，但确实有角动量和磁矩——而且比例很反常。</div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), fb = $('fb'), modal = $('modal'), modalBox = $('modalBox');
  var S = { lv: 0, score: 0, wrongInLv: 0, t0: Date.now() };

  function setFb(msg, kind) { fb.innerHTML = msg; fb.className = 'fb' + (kind ? ' ' + kind : ''); }
  function setHud() {
    $('hudLv').textContent = Math.min(S.lv + 1, 5);
    $('hudScore').textContent = S.score;
    var steps = $('steps').children;
    for (var i = 0; i < steps.length; i++) {
      steps[i].className = 'step' + (i < S.lv ? ' done' : (i === S.lv ? ' cur' : ''));
    }
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var s = Math.floor((Date.now() - S.t0) / 1000);
    $('hudTime').textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  setInterval(tick, 500); tick();

  function showModal(html, actions) {
    modalBox.innerHTML = html + '<div class="acts" id="mActs"></div>';
    var acts = $('mActs');
    (actions || []).forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'btn' + (a.ghost ? ' ghost' : '');
      b.textContent = a.label;
      b.onclick = function () { if (a.fn) a.fn(); };
      acts.appendChild(b);
    });
    modal.classList.add('show');
  }
  function closeModal() { modal.classList.remove('show'); }
  function addScore(full) {
    var gain = Math.max(2, full - 2 * S.wrongInLv);
    S.score += gain; setHud(); return gain;
  }
  function goto(lv) {
    S.lv = lv; S.wrongInLv = 0; setHud();
    if (lv === 0) renderL0();
    else if (lv === 1) renderL1();
    else if (lv === 2) renderL2();
    else if (lv === 3) renderL3();
    else renderL4();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function num(s) {
    if (s == null) return NaN;
    s = String(s).trim().replace(/[−–—]/g, '-').replace(/[，,]/g, '');
    var m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
    if (m) return parseFloat(m[1]) / parseFloat(m[2]);
    return parseFloat(s);
  }

  // ============ 第 1 关：认出正确的表达式 ============
  function renderL0() {
    var opts = [
      ['−(e/m) p<sub>s</sub>', '√(s(s+1)) · 2μ<sub>B</sub>'],
      ['−(e/2m) p<sub>s</sub>', '√(s(s+1)) μ<sub>B</sub>'],
      ['−(e/m) p<sub>s</sub>', '2s μ<sub>B</sub>'],
      ['−(2e/m) p<sub>s</sub>', '√(s(s+1)) · 2μ<sub>B</sub>']
    ];
    stage.innerHTML =
      '<div class="panel">' +
        '<div class="qh">第 1 关 · 认出表达式</div>' +
        '<p class="qt">下面四组写法里，只有一组是<b>电子自旋运动磁矩</b>的正确表达式。' +
        '每组都同时给出了"矢量式"和"大小式"，请挑出全对的那一组。</p>' +
        '<div class="choices">' +
          opts.map(function (o, i) {
            return '<button class="choice" data-i="' + i + '">' +
              '<span class="fv">矢量式　μ<sub>s</sub> = ' + o[0] + '</span>' +
              '<span class="fm">大小　　μ<sub>s</sub> = ' + o[1] + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</div>';

    stage.querySelectorAll('.choice').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.i;
        if (i === 0) {
          b.classList.add('ok');
          stage.querySelectorAll('.choice').forEach(function (x) { x.disabled = true; });
          var gain = addScore(5);
          setFb('✓ 正确。三处关键都对了：' +
                '① 系数是 <b>e/m</b>（比轨道多一个 2）；② 有负号；' +
                '③ 大小是 <b>√(s(s+1))·2μ<sub>B</sub></b>，根号里是 s(s+1)。+' + gain + ' 分。', 'ok');
          setTimeout(function () { goto(1); }, 1600);
        } else {
          S.wrongInLv++;
          b.classList.add('no');
          setTimeout(function () { b.classList.remove('no'); }, 900);
          var why = [
            '',
            '✗ 这是把<b>轨道</b>的式子照抄过来了：自旋的系数是 e/m，不是 e/2m。',
            '✗ 大小错了：根号里是 s(s+1)，不是 s。你写的 2sμ<sub>B</sub> 其实是 μ<sub>sz</sub>（投影）。',
            '✗ 系数错了：多乘了一个 2，应该是 e/m 而不是 2e/m。'
          ][i] || '✗ 再想想。';
          setFb(why, 'bad');
        }
      };
    });
    setFb('提示：自旋比轨道"多一个 2"——这个 2 出现在系数的分母里，也出现在大小式的外面。');
  }

  // ============ 第 2 关：为什么分母不是 2m ============
  function renderL1() {
    var opts = [
      '因为自旋的角动量比轨道大一倍',
      '因为自旋的回旋磁比（e/m）是轨道（e/2m）的两倍',
      '因为自旋不带电，公式写法不同而已',
      '因为自旋的速度更快'
    ];
    stage.innerHTML =
      '<div class="panel">' +
        '<div class="qh">第 2 关 · 分母里的 2 去哪了</div>' +
        '<p class="qt">轨道是 <span class="mono">μ<sub>l</sub> = −(e/2m) p<sub>l</sub></span>，' +
        '自旋却是 <span class="mono">μ<sub>s</sub> = −(e/m) p<sub>s</sub></span>。为什么少了 2？</p>' +
        '<div class="choices">' +
          opts.map(function (o, i) { return '<button class="choice" data-i="' + i + '">' + o + '</button>'; }).join('') +
        '</div>' +
      '</div>';

    stage.querySelectorAll('.choice').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.i;
        if (i === 1) {
          b.classList.add('ok');
          stage.querySelectorAll('.choice').forEach(function (x) { x.disabled = true; });
          var gain = addScore(5);
          setFb('✓ 正确。同样的角动量，自旋产生<b>两倍</b>的磁矩。' +
                '可以说自旋的 g 因子 g<sub>s</sub> ≈ 2（精确值 2.0023）。' +
                '这个"2"没法用经典图像解释，是相对论量子力学的结果。+' + gain + ' 分。', 'ok');
          setTimeout(function () { goto(2); }, 1600);
        } else {
          S.wrongInLv++;
          b.classList.add('no');
          setTimeout(function () { b.classList.remove('no'); }, 800);
          setFb('✗ 角动量大小由 s 决定，不会凭空翻倍。差别在"每个单位角动量产生多少磁矩"上。', 'bad');
        }
      };
    });
    setFb('提示：对比两个式子前面括号里的系数。');
  }

  // ============ 第 3 关：自旋磁矩大小 ============
  function renderL2() {
    stage.innerHTML =
      '<div class="panel">' +
        '<div class="qh">第 3 关 · 自旋磁矩有多大</div>' +
        '<p class="qt">由 <span class="mono">p<sub>s</sub> = √(s(s+1)) ħ</span>，且系数是 e/m：</p>' +
        '<div class="formula">' +
          'μ<sub>s</sub> = (e/m) √(s(s+1)) ħ = √(s(s+1)) · 2μ<sub>B</sub>' +
          '　　<span class="dim">（因为 e/m = 2·e/2m）</span><br>' +
          '<span class="dim">代入 s = 1/2：√(3/4) = 0.866，所以 μ<sub>s</sub> = √3 μ<sub>B</sub> ≈ 1.73 μ<sub>B</sub></span>' +
        '</div>' +
        '<p class="qt">算一下：s = 1/2 时 μ<sub>s</sub> 是多少 μ<sub>B</sub>？（保留两位小数）</p>' +
        '<div class="rows">' +
          '<div class="row" id="r1"><span class="lab">μ<sub>s</sub></span>' +
            '<input type="text" inputmode="decimal" id="i1" placeholder="如 1.73" autocomplete="off">' +
            '<span class="unit">μ<sub>B</sub></span><span class="mark"></span></div>' +
        '</div>' +
        '<div class="toolbar"><button class="btn" id="sub">提交</button>' +
          '<button class="btn ghost" id="hint">看提示</button></div>' +
      '</div>';

    $('hint').onclick = function () {
      setFb('√(s(s+1)) 在 s = 1/2 时等于 √(3/4) ≈ 0.866；再乘 2 得 √3 ≈ 1.73。');
    };
    $('sub').onclick = check;
    $('i1').addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
    setFb('根号里是 s(s+1)，别忘了外面的 2。');

    function check() {
      var v = num($('i1').value);
      var ok = isFinite(v) && Math.abs(v - 1.732) <= 0.06;
      $('r1').classList.toggle('right', ok);
      $('r1').classList.toggle('wrong', !ok);
      if (ok) {
        var gain = addScore(10);
        setFb('✓ μ<sub>s</sub> = √3 μ<sub>B</sub> ≈ 1.73 μ<sub>B</sub>。' +
              '对比一下：s 只有 1/2，比 l = 1 小，但算出来的磁矩反而更大（1.73 > 1.41）。+' + gain + ' 分。', 'ok');
        setTimeout(function () { goto(3); }, 1500);
      } else {
        S.wrongInLv++;
        setFb('✗ 再算：√(3/4) × 2 = 0.866 × 2 = 1.732。', 'bad');
      }
    }
  }

  // ============ 第 4 关：μ_sz 只能取两个值 ============
  function renderL3() {
    stage.innerHTML =
      '<div class="panel">' +
        '<div class="qh">第 4 关 · 自旋磁矩的投影</div>' +
        '<p class="qt">自旋磁矩在 z 方向的投影：</p>' +
        '<div class="formula">' +
          'μ<sub>sz</sub> = (e/m) p<sub>sz</sub> = (e/m) m<sub>s</sub> ħ = 2m<sub>s</sub> μ<sub>B</sub>' +
          '　　<span class="dim">m<sub>s</sub> = ±1/2</span>' +
        '</div>' +
        '<p class="qt">把 m<sub>s</sub> 的两个值代进去，μ<sub>sz</sub> 能取哪些值？（单位 μ<sub>B</sub>，用逗号分隔）' +
        '一共有几个取向？</p>' +
        '<div class="rows">' +
          '<div class="row" id="rL"><span class="lab">μ<sub>sz</sub> 的取值</span>' +
            '<input type="text" class="wide" id="iL" placeholder="如 1,-1" autocomplete="off">' +
            '<span class="unit">μ<sub>B</sub></span><span class="mark"></span></div>' +
          '<div class="row" id="rN"><span class="lab">取向个数</span>' +
            '<input type="text" inputmode="numeric" id="iN" placeholder="填整数" autocomplete="off">' +
            '<span class="unit">个</span><span class="mark"></span></div>' +
        '</div>' +
        '<div class="toolbar"><button class="btn" id="sub">提交</button>' +
          '<button class="btn ghost" id="hint">看提示</button></div>' +
      '</div>';

    $('hint').onclick = function () {
      setFb('m<sub>s</sub> = +1/2 时 2m<sub>s</sub> = 1；m<sub>s</sub> = −1/2 时 2m<sub>s</sub> = −1。' +
            '所以只有 ±1 μ<sub>B</sub> 两个值。');
    };
    $('sub').onclick = check;
    ['iL', 'iN'].forEach(function (id) {
      $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
    });
    setFb('代值的时候，2 是乘在 m<sub>s</sub> 上的。');

    function check() {
      var list = String($('iL').value || '').split(/[,，、;；\s]+/).filter(Boolean).map(num).sort();
      var n = num($('iN').value);
      var ok1 = list.length === 2 && Math.abs(list[0] + 1) < 0.001 && Math.abs(list[1] - 1) < 0.001;
      var ok2 = n === 2;
      $('rL').classList.toggle('right', ok1); $('rL').classList.toggle('wrong', !ok1);
      $('rN').classList.toggle('right', ok2); $('rN').classList.toggle('wrong', !ok2);
      if (ok1 && ok2) {
        var gain = addScore(12);
        setFb('✓ 只有 <b>+1 μ<sub>B</sub></b> 和 <b>−1 μ<sub>B</sub></b> 两个值，对应 m<sub>s</sub> = ±1/2，' +
              '也就是两个取向。这就是斯特恩-盖拉赫实验里银原子束分裂成<b>两束</b>的原因。+' + gain + ' 分。', 'ok');
        setTimeout(function () { goto(4); }, 1700);
      } else {
        S.wrongInLv++;
        setFb('✗ 再算：2 × (+1/2) 和 2 × (−1/2)。', 'bad');
      }
    }
  }

  // ============ 第 5 关：两个锥面 ============
  function fitCanvas(cv, cssH) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = cv.getBoundingClientRect();
    var w = Math.max(280, rect.width || cv.clientWidth || 600);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(cssH * dpr);
    cv.style.height = cssH + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: cssH };
  }

  function drawSpin() {
    var cv = $('cv'); if (!cv) return;
    var f = fitCanvas(cv, 380), ctx = f.ctx, w = f.w;
    ctx.clearRect(0, 0, w, 390);

    var ox = w / 2, oy = 215, R = 120;
    var cosT = 0.5 / Math.sqrt(0.75);          // 0.5774 → θ = 54.7°
    var sinT = Math.sqrt(1 - cosT * cosT);

    // z 轴
    ctx.strokeStyle = '#39456b'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ox, oy + 95); ctx.lineTo(ox, oy - R - 45); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ox, oy - R - 52); ctx.lineTo(ox - 5, oy - R - 40); ctx.lineTo(ox + 5, oy - R - 40);
    ctx.closePath(); ctx.fillStyle = '#39456b'; ctx.fill();
    ctx.fillStyle = '#7c8cb8'; ctx.font = '13px Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('z（外磁场方向）', ox, oy - R - 58);

    // 两个锥面
    [1, -1].forEach(function (sign, i) {
      var y = -R * sign * cosT;
      var rr = R * sinT;
      var col = sign > 0 ? '#60a5fa' : '#fb7185';

      ctx.save();
      ctx.setLineDash([4, 5]);
      ctx.strokeStyle = 'rgba(120,135,175,.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(ox, oy + y, rr * 0.62, rr * 0.20, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();

      var px = ox + rr * 0.62, py = oy + y;
      ctx.strokeStyle = col; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(px, py); ctx.stroke();
      var ang = Math.atan2(py - oy, px - ox);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - 10 * Math.cos(ang - 0.4), py - 10 * Math.sin(ang - 0.4));
      ctx.lineTo(px - 10 * Math.cos(ang + 0.4), py - 10 * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fillStyle = col; ctx.fill();

      ctx.fillStyle = col; ctx.font = '700 12px Consolas, monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('m_s = ' + (sign > 0 ? '+1/2' : '−1/2'), px + 12, py - 8);
      ctx.fillStyle = '#8fa0c8'; ctx.font = '11px Consolas, monospace';
      ctx.fillText('μ_sz = ' + (sign > 0 ? '+1' : '−1') + ' μ_B', px + 12, py + 8);
    });

    // 夹角标注
    ctx.save();
    ctx.setLineDash([]); ctx.strokeStyle = 'rgba(45,212,191,.75)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(ox, oy, 62, -Math.PI / 2, -Math.PI / 2 + Math.acos(cosT)); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#2dd4bf'; ctx.font = '700 13px Consolas, monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('54.7°', ox + 34, oy - 74);

    ctx.fillStyle = '#7c8cb8'; ctx.font = '12px "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('两个取向，都在与 z 轴成 54.7° 的锥面上', 12, 10);
    ctx.fillText('不是"朝上"和"朝下"——这一点很容易记错', 12, 30);
  }

  function renderL4() {
    var opts = [
      'μ<sub>s</sub> 沿 z 轴向上，另一个沿 z 轴向下（夹角 0° 和 180°）',
      '两个取向与 z 轴都成 54.7° 夹角，只是方位不同',
      '两个取向与 z 轴都成 90°（垂直于磁场）',
      '两个取向与 z 轴成 35.3° 和 144.7°'
    ];
    stage.innerHTML =
      '<div class="panel">' +
        '<div class="qh">第 5 关 · 两个锥面</div>' +
        '<p class="qt">把 s = 1/2 的两个自旋取向画出来。它们与 z 轴的夹角是多少？</p>' +
        '<canvas id="cv"></canvas>' +
        '<p class="cap">自旋角动量的大小是固定的，能变的只有它的方向。</p>' +
        '<div class="choices">' +
          opts.map(function (o, i) { return '<button class="choice" data-i="' + i + '">' + o + '</button>'; }).join('') +
        '</div>' +
      '</div>';

    drawSpin();
    window.addEventListener('resize', function () { if (S.lv === 4) drawSpin(); });

    stage.querySelectorAll('.choice').forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.i;
        if (i === 1) {
          b.classList.add('ok');
          stage.querySelectorAll('.choice').forEach(function (x) { x.disabled = true; });
          var gain = addScore(15);
          setFb('✓ 正确。cos θ = m<sub>s</sub>/√(s(s+1)) = 0.5/0.866 = 0.577，所以 θ ≈ <b>54.7°</b>。' +
                '两个取向是"锥面上的两个方向"，不是首尾朝上朝下。+' + gain + ' 分。', 'ok');
          setTimeout(finish, 1400);
        } else {
          S.wrongInLv++;
          b.classList.add('no');
          setTimeout(function () { b.classList.remove('no'); }, 800);
          setFb('✗ 用 cos θ = m<sub>s</sub>/√(s(s+1)) 算：0.5 ÷ 0.866 = 0.577，θ = 54.7°。' +
                '（35.3° 是 l = 2、m<sub>l</sub> = 2 时的角度，别混。）', 'bad');
        }
      };
    });
    setFb('提示：算一下 cos θ = m<sub>s</sub>/√(s(s+1))。');
  }

  // ============ 结算 ============
  function finish() {
    showModal(
      '<h2>🏆 通关！自旋磁矩小结</h2>' +
      '<div class="body">' +
        '<div class="big">' + S.score + ' 分</div>' +
        '<div class="kv">' +
          '<div class="kvr"><span>矢量关系</span><b>μ<sub>s</sub> = −(e/m) p<sub>s</sub></b></div>' +
          '<div class="kvr"><span>大小</span><b>√(s(s+1)) · 2μ<sub>B</sub> = √3 μ<sub>B</sub></b></div>' +
          '<div class="kvr"><span>z 分量</span><b>μ<sub>sz</sub> = 2m<sub>s</sub> μ<sub>B</sub> = ±1 μ<sub>B</sub></b></div>' +
          '<div class="kvr"><span>取向数</span><b>2s+1 = 2</b></div>' +
        '</div>' +
        '<p style="margin-top:14px"><b>和轨道磁矩对比：</b>' +
          '轨道磁矩的投影是 μ<sub>B</sub> 的整数倍、有 2l+1 个取向；' +
          '自旋只有 2 个取向，投影仍是 ±1 μ<sub>B</sub>，但对应的角动量只有 ħ/2。</p>' +
        '<p style="color:#93a2c7">这正是斯特恩-盖拉赫实验的关键：银原子束分裂成<b>两束</b>，' +
          '不可能是轨道磁矩（那样会分成奇数束）。后来才知道，银原子的磁矩几乎全来自那个 5s 电子的<b>自旋</b>。</p>' +
      '</div>',
      [
        { label: '看总磁矩', fn: function () { closeModal(); location.href = 'moment.html'; } },
        { label: '回到合集', ghost: true, fn: function () { location.href = 'index.html'; } }
      ]
    );
  }

  function intro() {
    showModal(
      '<h2>🎯 情景：一个"多出来的"磁矩</h2>' +
      '<div class="body">' +
        '<p>用轨道磁矩去算银原子的偏转，怎么都对不上。斯特恩和盖拉赫测到的是<b>两束</b>，' +
        '而按轨道磁矩应该分成奇数束。多出来的那个磁矩，来自电子的<b>自旋</b>。</p>' +
        '<p style="margin-bottom:6px">五关任务：</p>' +
        '<ul>' +
          '<li><b>1</b>　认出正确的表达式（矢量式 + 大小式）</li>' +
          '<li><b>2</b>　为什么自旋的系数是 e/m，而不是 e/2m</li>' +
          '<li><b>3</b>　算 μ<sub>s</sub> = √3 μ<sub>B</sub></li>' +
          '<li><b>4</b>　算 μ<sub>sz</sub> = 2m<sub>s</sub> μ<sub>B</sub>，只有 ±1 μ<sub>B</sub></li>' +
          '<li><b>5</b>　看两个自旋取向其实在 54.7° 的锥面上</li>' +
        '</ul>' +
      '</div>',
      [{ label: '开始闯关', fn: function () { closeModal(); goto(0); } }]
    );
  }

  setHud();
  var deepLv = parseInt(new URLSearchParams(location.search).get('lv'), 10);
  if (deepLv >= 1 && deepLv <= 5) goto(deepLv - 1);
  else intro();
})();
</script>
</body>
